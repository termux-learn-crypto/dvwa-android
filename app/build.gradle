plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Fixed signing key (committed on purpose, see keystore.properties) so every
// build installs as an update over the previous one.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }
android {
    namespace 'org.dvwa.android'
    compileSdk 34
    defaultConfig {
        applicationId "org.dvwa.android"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.1.1"
    }
    signingConfigs {
        dvwa {
            storeFile file(keystoreProps.getProperty('storeFile', 'dvwa-release.keystore'))
            storePassword keystoreProps.getProperty('storePassword', 'dvwa-android')
            keyAlias keystoreProps.getProperty('keyAlias', 'dvwa')
            keyPassword keystoreProps.getProperty('keyPassword', 'dvwa-android')
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.dvwa }
        release {
            minifyEnabled false
            signingConfig signingConfigs.dvwa
        }
    }
    buildFeatures { viewBinding true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress += ['php','js','html'] }
    lint { abortOnError false; checkReleaseBuilds false }
    packaging { resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module'] } }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.11.0'
    // Real JavaScript engine for the XSS / CSP / JavaScript modules (no WebView). Needs minSdk 26.
    implementation 'org.mozilla:rhino:1.9.1'
}
