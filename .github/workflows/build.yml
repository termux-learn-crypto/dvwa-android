name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk dvwa-native-v2.0.0-debug.apk
      - name: Verify no INTERNET permission / no WebView
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions dvwa-native-v2.0.0-debug.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET permission found"; exit 1; fi
          if grep -rq "android.webkit" app/src/main/java; then echo "WebView usage found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dvwa-native-debug-apk
          path: dvwa-native-v2.0.0-debug.apk
      - name: Publish release v2.0.0
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: DVWA Offline v2.0.0 (fully native)
          body: |
            Fully native Android rewrite of DVWA (Kotlin, Material Components, ViewBinding) - debug build.
            - No WebView, no embedded web server, no INTERNET permission. Everything runs offline in the app sandbox.
            - 17 modules x 4 security levels (Low/Medium/High/Impossible), View Source (real DVWA PHP) and Help on every module.
            - Real bundled SQLite for SQLi / Blind SQLi / Brute Force; fake shell for Command Injection.
            - XSS (DOM/Reflected/Stored), CSP Bypass and JavaScript Attacks are simulated natively: payloads are detected and the effect is shown (no script engine).
            Login: admin / password. Built from commit ${{ github.sha }}.
          files: dvwa-native-v2.0.0-debug.apk
          make_latest: true
