name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk dvwa-offline-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dvwa-offline-debug-apk
          path: dvwa-offline-debug.apk
      - name: Publish release v1.0.0
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: DVWA Offline v1.0.0
          body: |
            Offline Android clone of DVWA (debug build). Embedded server on 127.0.0.1:8080 only.
            Login: admin / password. Built from commit ${{ github.sha }}.
          files: dvwa-offline-debug.apk
          make_latest: true
