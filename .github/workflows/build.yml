name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk dvwa-native-${{ github.ref_name }}-debug.apk
      - name: Verify no WebView
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions dvwa-native-${{ github.ref_name }}-debug.apk | tee perms.txt
          if grep -rq "android.webkit" app/src/main/java; then echo "WebView usage found"; exit 1; fi
      - name: Verify signing certificate (fixed key)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs dvwa-native-${{ github.ref_name }}-debug.apk | tee certs.txt
          grep -qi "a924f92a3d7fbc15a18230d336297e259cd944db746688429865a3597eff5d5d" certs.txt || { echo "Unexpected signing cert"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dvwa-native-debug-apk
          path: dvwa-native-${{ github.ref_name }}-debug.apk
      - name: Publish release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DVWA Native ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: dvwa-native-${{ github.ref_name }}-debug.apk
          make_latest: true
