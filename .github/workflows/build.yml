name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk dvwa-native-v2.1.0-debug.apk
      - name: Verify no INTERNET permission / no WebView
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions dvwa-native-v2.1.0-debug.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET permission found"; exit 1; fi
          if grep -rq "android.webkit" app/src/main/java; then echo "WebView usage found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dvwa-native-debug-apk
          path: dvwa-native-v2.1.0-debug.apk
      - name: Publish release v2.1.0
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: DVWA Offline v2.1.0 (Hindi + Hinglish + User Guide)
          body: |
            Fully native Android DVWA (Kotlin, no WebView, no INTERNET permission) - debug build.
            New in v2.1.0:
            - Language switcher: English, हिन्दी (Hindi), Hinglish. Login screen 🌐 button, drawer > Settings > Language, or the ⋮ menu. Choice is saved and applied app-wide (per-app locale; Android 13+ system "App language" also works). Default on first launch: Hinglish, with a first-run language picker.
            - All UI text, messages, errors, dialogs, security level names and every module's Help translated to Hindi and Hinglish (technical terms like SQL Injection, XSS, CSRF, payload, cookie stay in English). PHP source in View Source is unchanged; its headings are translated.
            - New in-app User Guide / Kaise Use Karein / उपयोग गाइड (drawer + Home button + login screen) with per-module walkthroughs, example payloads and troubleshooting.
            - 4-slide first-run tutorial in the chosen language.
            - docs/USER_GUIDE.md (Hinglish) and docs/USER_GUIDE_HI.md (Hindi).
            Login: admin / password. Built from commit ${{ github.sha }}.
          files: dvwa-native-v2.1.0-debug.apk
          make_latest: true
